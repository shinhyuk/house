name: apt-watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m collector.run --once
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Persist snapshots
        run: |
          git config user.name "apt-watch-bot"
          git config user.email "apt-watch-bot@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet && exit 0
          git commit -m "chore: update listing snapshots"
          git push
